[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "consensus-hk-ppo"
version = "1.0.0"
description = "PPO interventions for multidimensional bounded-confidence opinion dynamics"
requires-python = ">=3.9"
dependencies = [
    "numpy==2.0.2",
    "gymnasium==1.1.1",
    "stable-baselines3==2.7.1",
    "torch==2.8.0",
    "cloudpickle==3.1.2",
    "tensorboard==2.20.0",
    "matplotlib==3.9.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["consensus_hk*"]

